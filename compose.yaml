name: sitesensory

services:
    database:
        image: pgvector/pgvector:0.8.6-pg18-bookworm
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-sitesensory}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?請在 .env 設定 POSTGRES_PASSWORD}
            POSTGRES_USER: ${POSTGRES_USER:-sitesensory}
        healthcheck:
            test:
                - CMD-SHELL
                - pg_isready -U "${POSTGRES_USER:-sitesensory}" -d "${POSTGRES_DB:-sitesensory}"
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s
        ports:
            - 127.0.0.1:${POSTGRES_PORT:-55432}:5432
        restart: unless-stopped
        volumes:
            - database-data:/var/lib/postgresql

volumes:
    database-data:
